[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-and-observability"
version = "1.0.0"
description = "Automated Data Quality Gatekeeper, Quarantine, and Observability Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mohammad javad Dianat", email = "dianatofficial9@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.1,<4.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "jinja2>=3.1.4",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.8",
    "flake8>=7.0.0",
    "black>=24.4.2",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
