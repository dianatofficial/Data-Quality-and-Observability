name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Build, Lint & Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff & Flake8
        run: |
          ruff check src/ tests/ config/ scripts/
          flake8 src/ tests/ config/ scripts/ --max-line-length=100 --extend-ignore=E501,E203

      - name: Run Test Suite with Pytest & Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Validate Standalone Seed Script
        run: |
          python scripts/seed_data.py
